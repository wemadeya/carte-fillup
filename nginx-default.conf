# Remplace /etc/nginx/conf.d/default.conf de l'image nginx:alpine.
# Même comportement que la config d'origine, avec en plus Cache-Control: no-cache
# sur les pages, le JS et le CSS.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    location / {
        index  index.html index.htm;
    }

    # no-cache : le navigateur garde le fichier mais demande au serveur s'il a
    # changé à chaque visite (réponse 304 très légère si rien n'a bougé).
    # Sans ça, le 10/11/2026, des utilisateurs gardaient l'ancien script.js
    # (token Mapbox cassé) plusieurs heures après le déploiement du correctif.
    location ~* \.(?:html?|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
